[tool.pytest.ini_options]
pythonpath = [
  "."
]

[project]
name = "template-generator"
description = "A small program to generate templates by replacing key names in files and file/folder names by specific values"
authors= [{name = "Øyvind Rørtveit", email = "oyvind.rortveit@naxystech.com"}]
dependencies =["toml", "platformdirs"]
dynamic = ["version"]
readme = "README.md"

[project.scripts]
template-gen = "template_generator.project_from_template:entry_point"
template-gui = "template_generator.project_from_template:entry_point_gui"
update-template = "template_generator.update_template:entry_point"
gitlab-new = "template_generator.create_gitlab_project:entry_point"
template-gen-gen = "template_generator.project_from_template:template_gen_gen"


[tool.setuptools.dynamic]
version = {file = "template_generator/VERSION"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"