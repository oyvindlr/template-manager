[tool.pytest.ini_options]
pythonpath = [
  "."
]

[project]
name = "template-manager"
description = "A small program to generate templates by replacing key names in files and file/folder names by specific values"
authors= [{name = "Øyvind Rørtveit", email = "oyvind.rortveit@naxystech.com"}]
dependencies =[
    "jinja2>=3.1",
    "toml",
    "platformdirs",
    "requests",
]
dynamic = ["version"]
readme = "README.md"

[project.scripts]
template-gen = "template_manager.project_from_template:entry_point"
template-gui = "template_manager.project_from_template:entry_point_gui"
template-update = "template_manager.update_template:entry_point"
template-reverse-sync = "template_manager.reverse_sync:entry_point"
gitlab-new = "template_manager.create_gitlab_project:entry_point"
template-gen-gen = "template_manager.project_from_template:template_gen_gen"
template-to-cookiecutter = "template_manager.cookiecutter:entry_point"


[tool.setuptools.dynamic]
version = {file = "template_manager/VERSION"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov",
  "pytest-mock",
  "requests-mock",
]

[project.optional-dependencies]
gui = ["gooey"]
