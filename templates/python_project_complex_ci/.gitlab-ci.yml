stages:
  - test
  - build
  - prepare
  - release
  - deploy


default:
  image: my_python_docker:latest

test-job:
  stage: test
  script:
    - pytest --cov=%project% --cov-report term --cov-report xml:coverage.xml --junitxml=testreport.xml tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\\%|[1-9]?\d(?:\.\d+)?\\%)$/'
  artifacts:
    when: always
    reports:
      junit: testreport.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
        
build-job:
  stage: build
  script:
    - python3 -m build
  artifacts:
    when: on_success    
    expire_in: 30 days
    paths:
      - dist/*

prepare-release-major-minor:
  stage: prepare
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.0$/' #Run this job whenever a new tag is created in the form [v]N.N.N
  script:
    - echo "Preparing release job for $CI_COMMIT_TAG"
    - AUTH_HEADER="PRIVATE-TOKEN:${CI_API_TOKEN}" 
    - API_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/milestones?title=${CI_COMMIT_TAG}
    - milestone_response=$(curl -s --header "$AUTH_HEADER" "$API_URL") #Look for milestones with the same name as this release 
    - echo $milestone_response
    - |
      if [ "$milestone_response" = "[]" ]; then
        echo "Release failed: No milestone found with the title \"${CI_COMMIT_TAG}\""
        echo "If $milestone_response reads \"unauthorized\", you may need to update CI_API_TOKEN"
        echo "Create a new access token under the project settings, and then update the variable CI_API_TOKEN"
        echo "under settings/CI-CD/variables"        
        exit 1
      fi
    - DESCRIPTION=$(echo $milestone_response | jq -r '.[0].description')
    - echo $DESCRIPTION >> description.md
    - echo "Close milestone"
    - MILESTONE_ID=$(echo $milestone_response | jq -r '.[0].id')
    - API_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/milestones/$MILESTONE_ID
    - curl --request PUT -s --header "$AUTH_HEADER" "$API_URL" --data "state_event=close"
  artifacts:
    paths:
      - description.md
  

.release-job-template:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Running release for version $CI_COMMIT_TAG"


release-patch:
  extends: .release-job-template 
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.[1-9]\d*$/' #Run this job whenever a new tag is created in the form [v]N.N.M and M!=0  
  release:
    name: '$CI_PROJECT_TITLE version $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'  
    description: ${CI_COMMIT_TAG_MESSAGE}

release-major-minor:
  extends: .release-job-template
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.0$/' #Run this job whenever a new tag is created in the form [v]N.N.0
  release:
    name: '$CI_PROJECT_TITLE version $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    milestones:
      - '$CI_COMMIT_TAG'
    description: description.md
  needs:
    - job: prepare-release-major-minor
      artifacts: true

.deploy-template:
  stage: deploy
  script:
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/4/packages/pypi dist/*
  environment: production  

deploy-release:
  extends: .deploy-template
  rules:    
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/' #Run this job for any release
      when: on_success

deploy-release-candidate:
  extends: .deploy-template
  rules:    
    - if: '$CI_COMMIT_TAG =~ /^[^r]*rc.*$/' #Run this job for any release candidate (whenever a new tag with "rc" (release candidate) in it is created)
      when: on_success
  environment: release_candidate

deploy-manual:
  extends: .deploy-template
  when: manual
  environment: manually_deployed
